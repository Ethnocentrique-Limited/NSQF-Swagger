openapi: 3.0.0
info:
  title: NSQF API
  version: 1.0.0
  description: Postman import — folders follow OpenAPI operation tags.
servers:
  - url: '{{BASE_URL}}'
  - url: '{{DGOVAL_BASE_URL}}'
  - url: https://nsqf-staging-nsqfbucketbucket-wrfrkfdv.s3.eu-west-1.amazonaws.com

tags:
  - name: Auth
  - name: Staff
  - name: Learner
  - name: Manage Learner
  - name: Learner assignment
  - name: Centre management
  - name: Generic
  - name: Digital folder - Staff view
  - name: Digital folder - Learner view
  - name: Assessment - Request assessment and Manage Requests
  - name: Assessment - Start scheduled assessment
  - name: Assessment - Assessment report (Unit level)
  - name: Learner dashboard and Notifications
  - name: Learner profile
  - name: Appeal assessment decision
  - name: Assessment review
  - name: Learner onboarding checklist
  - name: Staff /me — signature and schedule
  - name: Staff /me — shared (QAA, IQAM, MCP, TT)
  - name: Staff /me — QAA only
  - name: Staff /me — IQAM only
  - name: Staff /me — MCP and TT (trainers)
  - name: QAA Centre document management
  - name: Backoffice — Auth
  - name: Backoffice — Training providers
  - name: Backoffice — Awarding bodies
  - name: Backoffice — User management
  - name: Backoffice — NOS library
  - name: Backoffice — Awarding body portal
  - name: Backoffice — Audit log

